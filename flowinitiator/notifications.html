<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Holder | Multi-Agent Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 3rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, white, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .notification-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .notification-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            gap: 1.5rem;
            transition: all 0.3s ease;
            animation: slideIn 0.4s ease-out forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .notification-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .icon-box {
            width: 48px;
            height: 48px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            flex-shrink: 0;
        }

        .content {
            flex: 1;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .id {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .time {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .details {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #e2e8f0;
        }

        .empty-state {
            text-align: center;
            padding: 5rem;
            color: var(--text-muted);
            border: 2px dashed var(--glass-border);
            border-radius: 30px;
            font-size: 1.2rem;
        }

        /* Badge info */
        .method-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            border: 1px solid var(--glass-border);
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Notification Holder</h1>
            <p>Live stream of automated agent notifications</p>
        </header>

        <div id="notificationList" class="notification-list">
            <div class="empty-state">Waiting for notifications...</div>
        </div>
    </div>

    <script>
        const MOCK_SERVER_URL = 'http://localhost:3001';
        const listEl = document.getElementById('notificationList');
        let lastCount = 0;

        async function fetchNotifications() {
            try {
                const resp = await fetch(`${MOCK_SERVER_URL}/api/notifications`);
                const data = await resp.json();

                if (data.length === 0) {
                    listEl.innerHTML = '<div class="empty-state">No notifications yet. Send a message to the agent to trigger one.</div>';
                    return;
                }

                if (data.length !== lastCount) {
                    renderNotifications(data);
                    lastCount = data.length;
                }
            } catch (err) {
                listEl.innerHTML = '<div class="empty-state" style="color:#ef4444">Error: Mock server on port 3001 is offline.</div>';
            }
        }

        function renderNotifications(items) {
            listEl.innerHTML = '';
            items.forEach(item => {
                const date = new Date(item.sentAt).toLocaleTimeString();
                const div = document.createElement('div');
                div.className = 'notification-card';
                div.innerHTML = `
                    <div class="icon-box">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    </div>
                    <div class="content">
                        <div class="meta">
                            <span class="id">${item.id} <span class="method-badge">${item.method}</span></span>
                            <span class="time">${date}</span>
                        </div>
                        <div class="details">${item.details}</div>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        // Poll every 2 seconds
        setInterval(fetchNotifications, 2000);
        fetchNotifications();
    </script>
</body>
</html>
