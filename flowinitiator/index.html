<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Initiator | Group Chat Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #06b6d4;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.15) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            padding: 2rem;
            gap: 2rem;
        }

        .sidebar {
            width: 320px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: calc(100vh - 4rem);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .flow-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .flow-item {
            padding: 1rem;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .flow-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--glass-border);
        }

        .flow-item.active {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
        }

        .flow-item h3 { font-size: 1rem; margin-bottom: 0.25rem; }
        .flow-item p { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: calc(100vh - 4rem);
        }

        .chat-container {
            flex: 1;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.human {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
        }

        .message.system {
            align-self: center;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            max-width: 100%;
        }

        .message-author {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            opacity: 0.8;
        }

        .input-area {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 0.75rem;
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1rem;
            color: white;
            resize: none;
            height: 56px;
            max-height: 200px;
            outline: none;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        textarea:focus {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-badge.interrupted {
            background: rgba(234, 179, 8, 0.1);
            color: #eab308;
        }

        .interrupt-box {
            padding: 1rem;
            background: rgba(234, 179, 8, 0.1);
            border: 1px solid rgba(234, 179, 8, 0.2);
            border-radius: 16px;
            margin-top: 1rem;
        }

        .interrupt-box h4 { color: #eab308; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .interrupt-box p { font-size: 0.85rem; color: var(--text-muted); }

        /* ════════════ FORM-BASED TOOL COMPLETION ════════════ */

        .tool-form-container {
            background: rgba(6, 182, 212, 0.05);
            border: 1px solid rgba(6, 182, 212, 0.25);
            border-radius: 20px;
            padding: 1.5rem;
            margin-top: 0.5rem;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .tool-form-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .tool-form-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .tool-form-header-text h4 { color: var(--accent); font-size: 0.95rem; font-weight: 600; }
        .tool-form-header-text p { color: var(--text-muted); font-size: 0.8rem; margin-top: 2px; }

        .tool-form-fields { display: flex; flex-direction: column; gap: 1rem; }

        .tool-form-field { display: flex; flex-direction: column; gap: 0.35rem; }

        .tool-form-field label {
            font-size: 0.8rem; font-weight: 600; color: var(--text-muted);
            display: flex; align-items: center; gap: 0.4rem;
        }

        .tool-form-field label .mandatory-star { color: var(--secondary); font-weight: 700; }
        .tool-form-field label .filled-check { color: #22c55e; font-size: 0.9rem; }

        .tool-form-field input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
        }

        .tool-form-field input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
        }

        .tool-form-field input.missing {
            border-color: rgba(234, 179, 8, 0.4);
            background: rgba(234, 179, 8, 0.05);
        }

        .tool-form-field input.missing:focus {
            border-color: #eab308;
            box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.1);
        }

        .tool-form-field input.prefilled { border-color: rgba(34, 197, 94, 0.3); }

        .tool-form-actions {
            display: flex; gap: 0.75rem; margin-top: 1rem; justify-content: flex-end;
        }

        .tool-form-submit {
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: white; border: none;
            padding: 0.7rem 1.5rem; border-radius: 12px;
            font-size: 0.9rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
        }

        .tool-form-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(6, 182, 212, 0.3);
        }

        .tool-form-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        .tool-form-badge {
            display: inline-flex; align-items: center; gap: 0.35rem;
            background: rgba(6, 182, 212, 0.15); color: var(--accent);
            padding: 0.2rem 0.6rem; border-radius: 6px;
            font-size: 0.7rem; font-weight: 600;
            letter-spacing: 0.5px; text-transform: uppercase;
        }

        .tool-form-missing-summary { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }

        .missing-field-tag {
            background: rgba(234, 179, 8, 0.15); color: #eab308;
            padding: 0.2rem 0.6rem; border-radius: 6px;
            font-size: 0.7rem; font-weight: 600;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }

        .spinning { animation: spin 1s linear infinite; }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-3px); }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">GroupChat Engine</div>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">Select a flow to initiate agentic orchestration.</p>
        <div class="flow-list" id="flowList">
            <div style="text-align: center; padding: 2rem; color: var(--text-muted);">Loading flows...</div>
        </div>
        <div id="currentStatus" style="display: none;">
            <div class="status-badge" id="statusBadge">Ready</div>
        </div>
        <div style="margin-top: 2rem; border-top: 1px solid var(--glass-border); padding-top: 1.5rem;">
            <a href="notifications.html" target="_blank" style="display: flex; align-items: center; gap: 0.75rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.3s;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-muted)'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                View Notifications
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container" id="chatOutput">
            <div class="message system">Welcome. Please pick a flow and enter your initial prompt to start.</div>
        </div>
        <div class="input-area" id="inputArea">
            <textarea id="userInput" placeholder="Type your prompt here..."></textarea>
            <button class="send-btn" id="sendBtn" title="Send message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
        </div>
    </div>

    <script>
        var flowListEl = document.getElementById('flowList');
        var chatOutputEl = document.getElementById('chatOutput');
        var userInputEl = document.getElementById('userInput');
        var sendBtnEl = document.getElementById('sendBtn');
        var statusBadgeEl = document.getElementById('statusBadge');
        var currentStatusEl = document.getElementById('currentStatus');

        var selectedFlowId = null;
        var currentRunId = null;
        var isProcessing = false;
        var isInterrupted = false;
        var activeToolForm = null;

        // ════════ WebSocket ════════
        var socket = null;
        function connectWebSocket() {
            var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(protocol + '//' + window.location.host);

            socket.onopen = function() {
                console.log('Connected to Group Chat WebSocket');
                appendMessage('system', 'Connection established');
            };

            socket.onmessage = function(event) {
                var data = JSON.parse(event.data);
                console.log('WS Received:', data);

                if (data.type === 'update' || data.type === 'result') {
                    handleResponse(data);
                    if (data.type === 'result') setLoading(false);
                } else if (data.type === 'error') {
                    appendMessage('system', 'Error: ' + data.message);
                    setLoading(false);
                }
            };

            socket.onclose = function() {
                console.log('WebSocket disconnected. Reconnecting...');
                setLoading(false);
                setTimeout(connectWebSocket, 3000);
            };
        }

        userInputEl.addEventListener('input', function() {
            userInputEl.style.height = 'auto';
            userInputEl.style.height = Math.min(userInputEl.scrollHeight, 200) + 'px';
        });

        // ════════ Load Flows ════════
        function loadFlows() {
            fetch('/api/flows')
                .then(function(resp) { return resp.json(); })
                .then(function(flows) {
                    flowListEl.innerHTML = '';
                    flows.forEach(function(flow) {
                        var div = document.createElement('div');
                        div.className = 'flow-item';
                        div.innerHTML = '<h3>' + flow.flowName + '</h3><p>' + (flow.flowDescription || 'No description') + '</p>';
                        div.onclick = function() { selectFlow(flow.flowID, div); };
                        flowListEl.appendChild(div);
                    });
                })
                .catch(function() {
                    flowListEl.innerHTML = '<div style="color: #ef4444; padding: 1rem;">Failed to load flows.</div>';
                });
        }

        function selectFlow(flowId, element) {
            var items = document.querySelectorAll('.flow-item');
            for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
            element.classList.add('active');
            selectedFlowId = flowId;
            currentRunId = null;
            isInterrupted = false;
            activeToolForm = null;
            userInputEl.focus();
        }

        // ════════ Messages ════════
        function appendMessage(role, content, author) {
            var div = document.createElement('div');
            div.className = 'message ' + role;

            if (author) {
                var authorSpan = document.createElement('span');
                authorSpan.className = 'message-author';
                authorSpan.innerText = author;
                div.appendChild(authorSpan);
            }

            var contentDiv = document.createElement('div');
            if (content && content.indexOf('```') !== -1) {
                var parts = content.split('```');
                for (var i = 0; i < parts.length; i++) {
                    if (i % 2 === 1) {
                        var pre = document.createElement('pre');
                        pre.style.cssText = 'background:rgba(0,0,0,0.3);padding:1rem;border-radius:8px;margin:0.5rem 0;overflow-x:auto;';
                        pre.innerText = parts[i].replace(/^json\n/, '');
                        contentDiv.appendChild(pre);
                    } else {
                        var span = document.createElement('span');
                        span.innerText = parts[i];
                        contentDiv.appendChild(span);
                    }
                }
            } else {
                contentDiv.innerText = content || '';
            }

            div.appendChild(contentDiv);
            chatOutputEl.appendChild(div);
            chatOutputEl.scrollTop = chatOutputEl.scrollHeight;
        }

        // ════════ FORM-BASED TOOL COMPLETION ════════

        function renderToolForm(payload) {
            var toolName = payload.toolName;
            var agentName = payload.agentName;
            var toolDefinition = payload.toolDefinition || '';
            var sampleForm = payload.sampleForm;
            var missingFields = payload.missingFields || [];

            activeToolForm = payload;

            var container = document.createElement('div');
            container.className = 'tool-form-container';
            container.id = 'activeToolForm';

            // Header
            var header = document.createElement('div');
            header.className = 'tool-form-header';
            header.innerHTML =
                '<div class="tool-form-icon">' +
                    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                        '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>' +
                    '</svg>' +
                '</div>' +
                '<div class="tool-form-header-text">' +
                    '<h4><span class="tool-form-badge">TOOL</span> ' + toolName + '</h4>' +
                    '<p>Agent <strong>' + agentName + '</strong> needs your input' + (toolDefinition ? ' \u2014 ' + toolDefinition : '') + '</p>' +
                '</div>';
            container.appendChild(header);

            // Missing field tags
            if (missingFields.length > 0) {
                var summary = document.createElement('div');
                summary.className = 'tool-form-missing-summary';
                for (var m = 0; m < missingFields.length; m++) {
                    var tag = document.createElement('span');
                    tag.className = 'missing-field-tag';
                    var fieldDef = null;
                    for (var s = 0; s < sampleForm.length; s++) {
                        if (sampleForm[s].label === missingFields[m]) { fieldDef = sampleForm[s]; break; }
                    }
                    tag.innerText = '\u26A0 ' + ((fieldDef && fieldDef.fieldLabel) || missingFields[m]);
                    summary.appendChild(tag);
                }
                container.appendChild(summary);
            }

            // Fields
            var fieldsDiv = document.createElement('div');
            fieldsDiv.className = 'tool-form-fields';

            for (var f = 0; f < sampleForm.length; f++) {
                var field = sampleForm[f];
                var isMissing = missingFields.indexOf(field.label) !== -1;
                var isPrefilled = field.value && field.value.trim() !== '';

                var fieldDiv = document.createElement('div');
                fieldDiv.className = 'tool-form-field';

                var label = document.createElement('label');
                label.setAttribute('for', 'tf_' + field.label);
                var labelHTML = (field.fieldLabel || field.label);
                if (field.mandatory) labelHTML += ' <span class="mandatory-star">*</span>';
                if (isPrefilled) labelHTML += ' <span class="filled-check">\u2713 auto-filled</span>';
                label.innerHTML = labelHTML;

                var input = document.createElement('input');
                input.type = (field.type === 'number') ? 'number' : 'text';
                input.id = 'tf_' + field.label;
                input.name = field.label;
                input.value = field.value || '';
                input.placeholder = field.fieldLabel || field.label;
                if (isMissing) {
                    input.className = 'missing';
                    input.setAttribute('data-missing', 'true');
                } else if (isPrefilled) {
                    input.className = 'prefilled';
                }

                fieldDiv.appendChild(label);
                fieldDiv.appendChild(input);
                fieldsDiv.appendChild(fieldDiv);
            }
            container.appendChild(fieldsDiv);

            // Submit button
            var actionsDiv = document.createElement('div');
            actionsDiv.className = 'tool-form-actions';
            var submitBtn = document.createElement('button');
            submitBtn.className = 'tool-form-submit';
            submitBtn.id = 'toolFormSubmitBtn';
            submitBtn.innerHTML =
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:6px;"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
                'Submit &amp; Execute Tool';
            submitBtn.onclick = function() { submitToolForm(); };
            actionsDiv.appendChild(submitBtn);
            container.appendChild(actionsDiv);

            chatOutputEl.appendChild(container);
            chatOutputEl.scrollTop = chatOutputEl.scrollHeight;

            // Focus first missing field
            var firstMissing = container.querySelector('input.missing');
            if (firstMissing) firstMissing.focus();
        }

        function submitToolForm() {
            if (!activeToolForm || !currentRunId) {
                console.error('[submitToolForm] No activeToolForm or currentRunId!', activeToolForm, currentRunId);
                return;
            }

            var formContainer = document.getElementById('activeToolForm');
            if (!formContainer) return;

            var formData = {};
            var inputs = formContainer.querySelectorAll('input');
            var hasEmptyMandatory = false;

            for (var i = 0; i < inputs.length; i++) {
                formData[inputs[i].name] = inputs[i].value.trim();
                if (inputs[i].getAttribute('data-missing') === 'true' && !inputs[i].value.trim()) {
                    hasEmptyMandatory = true;
                    inputs[i].style.borderColor = 'rgba(239, 68, 68, 0.6)';
                    inputs[i].style.boxShadow = '0 0 0 3px rgba(239, 68, 68, 0.1)';
                }
            }

            if (hasEmptyMandatory) {
                var btn = document.getElementById('toolFormSubmitBtn');
                btn.style.animation = 'shake 0.4s ease';
                setTimeout(function() { btn.style.animation = ''; }, 400);
                return;
            }

            console.log('[submitToolForm] Sending form data:', formData, 'runId:', currentRunId);
            appendMessage('human', 'Form submitted for "' + activeToolForm.toolName + '":\n' + JSON.stringify(formData, null, 2));

            for (var j = 0; j < inputs.length; j++) inputs[j].disabled = true;
            var submitBtn = document.getElementById('toolFormSubmitBtn');
            if (submitBtn) { submitBtn.disabled = true; submitBtn.innerText = 'Submitted \u2713'; }

            setLoading(true);
            socket.send(JSON.stringify({
                type: 'resume',
                flowId: selectedFlowId,
                runId: currentRunId,
                userInput: formData
            }));

            activeToolForm = null;
            isInterrupted = false;
        }

        // ════════ Send / Resume ════════
        function handleSend() {
            var prompt = userInputEl.value.trim();
            if (!prompt || isProcessing) return;
            if (!selectedFlowId) { alert('Please select a flow from the sidebar first.'); return; }
            if (socket.readyState !== WebSocket.OPEN) { appendMessage('system', 'Connection lost. Please wait...'); return; }

            setLoading(true);
            appendMessage('human', prompt);
            userInputEl.value = '';
            userInputEl.style.height = '56px';

            if (activeToolForm) activeToolForm = null;

            var payload;
            if (isInterrupted) {
                payload = { type: 'resume', flowId: selectedFlowId, runId: currentRunId, userInput: prompt };
            } else {
                payload = { type: 'start', flowId: selectedFlowId, prompt: prompt };
            }

            socket.send(JSON.stringify(payload));
        }

        // ════════ Response Handler ════════
        function handleResponse(data) {
            // FIX: check all possible runId fields
            currentRunId = data.runId || data.configId || data.conversation_id;
            currentStatusEl.style.display = 'block';

            console.log('[handleResponse] status:', data.status, '| runId:', currentRunId);
            console.log('[handleResponse] interruptData:', JSON.stringify(data.interruptData));

            // Re-render messages
            if (data.messages && data.messages.length > 0) {
                chatOutputEl.innerHTML = '';
                for (var i = 0; i < data.messages.length; i++) {
                    appendMessage(data.messages[i].role, data.messages[i].content, data.messages[i].name);
                }
            }

            if (data.status === 'interrupted') {
                isInterrupted = true;

                // Check if any interrupt data is a form-based tool completion
                var formInterrupt = null;
                if (data.interruptData && data.interruptData.length > 0) {
                    console.log('[handleResponse] Scanning ' + data.interruptData.length + ' interrupt entries...');
                    for (var j = 0; j < data.interruptData.length; j++) {
                        var entry = data.interruptData[j];
                        console.log('[handleResponse] entry[' + j + '].type =', entry ? entry.type : 'null');
                        if (entry && entry.type === 'incomplete_tool_call') {
                            formInterrupt = entry;
                            break;
                        }
                    }
                } else {
                    console.log('[handleResponse] No interruptData in response');
                }

                if (formInterrupt) {
                    console.log('[handleResponse] FORM INTERRUPT FOUND for tool:', formInterrupt.toolName);
                    statusBadgeEl.innerText = 'Form: ' + formInterrupt.toolName;
                    statusBadgeEl.className = 'status-badge interrupted';
                    renderToolForm(formInterrupt);
                } else {
                    statusBadgeEl.innerText = 'Interrupt: Awaiting User Input';
                    statusBadgeEl.className = 'status-badge interrupted';

                    var interruptDiv = document.createElement('div');
                    interruptDiv.className = 'interrupt-box';
                    interruptDiv.innerHTML = '<h4>Action Required</h4>' +
                        '<p>' + (data.reason || 'The agent needs more information from you.') + '</p>' +
                        '<small style="opacity:0.5;">Run ID: ' + currentRunId + '</small>';
                    chatOutputEl.appendChild(interruptDiv);
                    chatOutputEl.scrollTop = chatOutputEl.scrollHeight;
                }

            } else if (data.status === 'completed') {
                isInterrupted = false;
                activeToolForm = null;
                statusBadgeEl.innerText = 'Flow Completed';
                statusBadgeEl.className = 'status-badge';
                appendMessage('system', '\u2500 Graph reached END \u2500');
            } else if (data.status === 'running') {
                statusBadgeEl.innerText = 'Agents are working...';
                statusBadgeEl.className = 'status-badge';
            }
        }

        function setLoading(loading) {
            isProcessing = loading;
            sendBtnEl.disabled = loading;
            if (loading) {
                sendBtnEl.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="spinning"><circle cx="12" cy="12" r="10" stroke-opacity="0.2"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>';
            } else {
                sendBtnEl.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>';
            }
        }

        sendBtnEl.onclick = handleSend;
        userInputEl.onkeydown = function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
        };

        loadFlows();
        connectWebSocket();
    </script>
</body>
</html>
